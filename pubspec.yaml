name: am_in
description: "KU Attendance — Kenyatta University attendance management platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- Firebase (backend) ---
  # firebase_core 4.15.0 was already resolved in this project, so the whole
  # Firebase suite is pinned to the matching 4.x/6.x generation.
  firebase_core: ^4.15.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  cloud_functions: ^6.0.0

  # --- State management & routing ---
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # --- Device / platform ---
  geolocator: ^13.0.0
  connectivity_plus: ^6.0.0

  # --- Utilities ---
  intl: ^0.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
